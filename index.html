<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملحمة نصر أكتوبر المجيد | توثيق تاريخ العزيمة والنصر</title>
    <!-- استيراد الخطوط وأيقونات FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #d32f2f;
            --secondary-color: #c62828;
            --gold-color: #f39c12;
            --dark-bg: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(211, 47, 47, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* رأس الصفحة */
        header {
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.95), rgba(30, 41, 59, 0.95)), url('https://upload.wikimedia.org/wikipedia/commons/4/45/Egyptian_Infantry_Crossing_Suez_Canal_1973.jpg') no-repeat center center/cover;
            background-blend-mode: overlay;
            padding: 80px 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
            position: relative;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        header h1 span {
            color: var(--gold-color);
        }

        header p {
            font-size: 1.3rem;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto;
        }

        .badge-hero {
            display: inline-block;
            background: rgba(211, 47, 47, 0.2);
            border: 1px solid var(--primary-color);
            color: #ff6b6b;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 40px;
            font-weight: 800;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: var(--gold-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* شبكة الكروت للمحطات */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .station-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .station-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px rgba(211, 47, 47, 0.2);
            border-color: var(--gold-color);
        }

        .card-image-container {
            position: relative;
            height: 220px;
            overflow: hidden;
            background-color: #1f2937;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .station-card:hover .card-image-container img {
            transform: scale(1.1);
        }

        .card-number-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary-color);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-subtitle {
            font-size: 1rem;
            color: var(--gold-color);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-summary {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease, transform 0.2s ease;
            font-size: 0.95rem;
            border: none;
        }

        .btn-details {
            background-color: var(--primary-color);
            color: #fff;
        }

        .btn-details:hover {
            background-color: var(--secondary-color);
        }

        .btn-video {
            background-color: rgba(243, 156, 18, 0.15);
            color: var(--gold-color);
            border: 1px solid var(--gold-color);
        }

        .btn-video:hover {
            background-color: var(--gold-color);
            color: #000;
        }

        /* نافذة التفاصيل المنبثقة (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            border-radius: 20px;
            overflow-y: auto;
            border: 1px solid var(--gold-color);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            position: relative;
            height: 300px;
        }

        .modal-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--primary-color);
        }

        .modal-body {
            padding: 35px;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
        }

        .modal-subtitle {
            font-size: 1.1rem;
            color: var(--gold-color);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .modal-text {
            font-size: 1.05rem;
            color: var(--text-color);
            line-height: 2;
            margin-bottom: 30px;
            white-space: pre-line;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            border-right: 4px solid var(--primary-color);
        }

        .modal-video-section {
            margin-top: 20px;
            text-align: center;
        }

        .modal-video-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ff0000;
            color: #fff;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .modal-video-btn:hover {
            background: #cc0000;
            transform: scale(1.05);
        }

        /* الفوتر */
        footer {
            text-align: center;
            padding: 30px;
            background: #080c14;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 80px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
            .stations-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة -->
    <header>
        <div class="badge-hero"><i class="fa-solid fa-shield-halved"></i> توثيق تاريخي رسمي</div>
        <h1>ملحمة <span>نصر أكتوبر</span> المجيد</h1>
        <p>استعراض تفصيلي لأعظم خطط العبور العسكري الحديث، من عمق الهزيمة والتخطيط الاستراتيجي إلى لحظات الفخر وتحطيم أسطورة خط بارليف.</p>
    </header>

    <!-- محتوى المحطات -->
    <div class="container">
        <h2 class="section-title">محطات العبور والنصر</h2>
        <div class="stations-grid" id="stationsGrid"></div>
    </div>

    <!-- نافذة التفاصيل (Modal) -->
    <div class="modal-overlay" id="stationModal">
        <div class="modal-container">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="صورة المحطة">
            </div>
            <div class="modal-body">
                <h3 class="modal-title" id="modalTitle"></h3>
                <div class="modal-subtitle" id="modalSubtitle"></div>
                <div class="modal-text" id="modalText"></div>
                <div class="modal-video-section">
                    <a id="modalVideoBtn" href="" target="_blank" class="modal-video-btn">
                        <i class="fa-brands fa-youtube fa-xl"></i> مشاهدة الفيديو الوثائقي الحقيقي
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة - توثيق ملحمة أكتوبر المجيدة | تحيا مصر</p>
    </footer>

    <script>
        // بيانات محطات حرب أكتوبر مع روابط صور موثقة وحقيقية من ويكيبيديا
        const stationsData = [
            {
                id: 1,
                title: "المحطة الأولى: مرحلة الصمود والاستنزاف",
                subtitle: "إعادة بناء القوات المسلحة (1967 - 1970)",
                summary: "بين أنقاض هزيمة 1967، بدأت مصر في إعادة بناء جيشها من الصفر، وخاضت حرب الاستنزاف لتأكيد الإرادة وإسقاط نظرية الأمن الإسرائيلي.",
                image: "https://upload.wikimedia.org/wikipedia/commons/2/22/Egyptian_tanks_Sinai_1973.jpg",
                fullText: "بعد نكسة يونيو 1967، لم تستسلم مصر. بدأت القيادة السياسية والعسكرية إعادة تنظيم القوات المسلحة وإنشاء حائط الصواريخ للدفاع الجوي، وخاضت مصر 'حرب الاستنزاف' التي استنزفت العدو في سيناء، وأثبتت المقاومة الباسلة في معارك مثل رأس العش، مما أعاد الثقة الكاملة للجندي المصري وأكد استعداده للمعركة الكبرى.",
                videoUrl: "https://www.youtube.com/watch?v=8_cUe_OQkNQ"
            },
            {
                id: 2,
                title: "المحطة الثانية: الخداع الاستراتيجي العبقري",
                subtitle: "خطة التضليل والمناورات (1973)",
                summary: "عملية خداع استراتيجي غير مسبوقة ضللت الاستخبارات الإسرائيلية والعالمية، وأوهمت العدو بأن مصر غير جاهزة للحرب نهائياً.",
                image: "https://upload.wikimedia.org/wikipedia/commons/e/ea/Anwar_Sadat_military_meeting_1973.jpg",
                fullText: "لتحقيق عنصر المفاجأة، وضعت القيادة المصرية خطة خداع استراتيجي محكمة؛ شملت تسريح الاحتياط تدريجياً، وإعلان مواعيد وهمية للمناورات، وإشاعة نقص قطع الغيار، وترك الأضواء مضاءة في المدن، ونشر تسريبات كاذبة للصحف الأجنبية عن عدم نية مصر خوض الحرب، مما أوقع الاستخبارات الإسرائيلية في استرخاء كامل.",
                videoUrl: "https://www.youtube.com/watch?v=trCqzAsqzMw"
            },
            {
                id: 3,
                title: "المحطة الثالثة: ساعة الصفر والعبور العظيم",
                subtitle: "الساعة 2:00 ظهراً - 6 أكتوبر 1973",
                summary: "انطلاق الضربة الجوية الكبرى وعمليات العبور التاريخية لآلاف المقاتلين المصريين فوق قناة السويس في معجزة عسكرية.",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/45/Egyptian_Infantry_Crossing_Suez_Canal_1973.jpg",
                fullText: "في تمام الساعة الثانية عصراً، انطلقت أكثر من 200 طائرة حربية مصرية لتنفذ ضربة جوية مركزة استهدفت مراكز القيادة والاتصالات ومحطات الرادار للعدو في سيناء بدقة مذهلة. في نفس اللحظة، تدفق آلاف الأبطال عبر قوارب مطاطية لتحطيم الحواجز ورفع الأعلام المصرية على الضفة الشرقية لقناة السويس.",
                videoUrl: "https://www.youtube.com/watch?v=fIbrYs_sCAo"
            },
            {
                id: 4,
                title: "المحطة الرابعة: تحطيم خط بارليف المانع",
                subtitle: "قهر أسطورة الساتر الترابي بالمياه",
                summary: "ابتكار عبقري باستخدام مضخات المياه العالية لتجريف الساتر الترابي المنيع واختراق الحصن الذي اعتبره العدو مستحيلاً.",
                image: "https://upload.wikimedia.org/wikipedia/commons/2/2b/Egyptian_flag_raised_Sinai_1973.jpg",
                fullText: "كان خط بارليف يعتبر أقوى دفاع هندسي في العصر الحديث، بساتره الترابي الشاهق ودشماته المسلحة. لكن المهندسين العسكريين المصريين ابتكروا حلاً عبقرياً باستخدام مضخات مياه ذات ضغط عالٍ جداً لتجريف الرمال وصنع ثغرات في الساتر الترابي خلال ساعات قليلة، مما مكن الدبابات والمشاة من العبور الكامل.",
                videoUrl: "https://www.youtube.com/watch?v=wM-SxFGdhW0"
            },
            {
                id: 5,
                title: "المحطة الخامسة: معارك الدبابات الكبرى",
                subtitle: "معارك الدروع وصمود رأس الكوبري",
                summary: "ملاحم بطولية خاضتها أفرع القوات المسلحة والدبابات المصرية لرد هجمات العدو المضادة وتثبيت السيطرة.",
                image: "https://upload.wikimedia.org/wikipedia/commons/2/22/Egyptian_tanks_Sinai_1973.jpg",
                fullText: "حاول الجيش الإسرائيلي شن هجمات مضادة عنيفة ومكثفة لدفن رأس الكوبري المصري وإلقائنا في القناة، إلا أن أبطال سلاح الدروع والمشاة، مدعومين بصواريخ المضادة للدبابات، كبدوا العدو خسائر فادحة في المعدات والأرواح، ودمروا مئات الدبابات الإسرائيلية في معارك ضارية أسقطت أسطورة الجيش الذي لا يُقهر.",
                videoUrl: "https://www.youtube.com/watch?v=CP3qrYXqOl0"
            },
            {
                id: 6,
                title: "المحطة السادسة: الانتصار ورفع العلم",
                subtitle: "تحقيق النصر الاستراتيجي والسلام المشرف",
                summary: "رفرف علم مصر خفاقاً فوق تراب سيناء الحبيبة، لتثبت العسكرية المصرية أن الإرادة والوطنية تصنعان المعجزات.",
                image: "https://upload.wikimedia.org/wikipedia/commons/4/45/Egyptian_Infantry_Crossing_Suez_Canal_1973.jpg",
                fullText: "تكللت ملحمة أكتوبر المجيدة بكسر شوكة العدو وإجباره على الجلوس على مائدة التفاوض من موقع قوة، واسترداد أرض سيناء الغالية بالكامل سياسياً وعسكرياً. لقد أثبت الجندي المصري أن المستحيل ليس مصرياً، وأن دماء الشهداء الأبرار هي الثمن الخالد لبقاء هذا الوطن حراً أبياً.",
                videoUrl: "https://www.youtube.com/watch?v=j_au7ZF3WgY"
            }
        ];

        // عرض الكروت في الصفحة
        const grid = document.getElementById('stationsGrid');

        stationsData.forEach((station, index) => {
            const card = document.createElement('div');
            card.className = 'station-card';
            card.innerHTML = `
                <div class="card-image-container">
                    <img src="${station.image}" alt="${station.title}" loading="lazy">
                    <div class="card-number-badge">${index + 1}</div>
                </div>
                <div class="card-content">
                    <div>
                        <h3 class="card-title">${station.title}</h3>
                        <div class="card-subtitle">${station.subtitle}</div>
                        <p class="card-summary">${station.summary}</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-details" onclick="openModal(${station.id})">
                            <i class="fa-solid fa-book-open"></i> التفاصيل
                        </button>
                        <a href="${station.videoUrl}" target="_blank" class="btn btn-video">
                            <i class="fa-solid fa-video"></i> فيديو حقيقي
                        </a>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        // دوال النافذة المنبثقة (Modal)
        const modal = document.getElementById('stationModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalText = document.getElementById('modalText');
        const modalVideoBtn = document.getElementById('modalVideoBtn');

        function openModal(id) {
            const station = stationsData.find(s => s.id === id);
            if (station) {
                modalImg.src = station.image;
                modalTitle.textContent = station.title;
                modalSubtitle.textContent = station.subtitle;
                modalText.textContent = station.fullText;
                modalVideoBtn.href = station.videoUrl;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
